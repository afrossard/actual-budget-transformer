# Actual Budget Transformer Configuration Template
# Copy this file to config.yml and fill in your actual values

# Map account identifiers (IBANs, card numbers) to friendly names.
# Used across all processors for output filenames.
account_names:
  "CH0000000000": "personal_checking"
  "CH1111111111": "savings"
  "1234567890123456": "personal_card"
  "6543210987654321": "partner_card"

processors:
  # UBS CSV Transaction Processor settings
  ubs_csv:
    # CSV parsing settings
    csv_settings:
      encoding: "utf-8-sig"
      separator: ";"
      header_rows: 8
      expected_columns: 15

    # Expected structure
    expected_header_labels:
      - "Numéro de compte:"
      - "IBAN:"
      - "Du:"
      - "Au:"
      - "Solde initial:"
      - "Solde final:"
      - "Évaluation en:"
      - "Nombre de transactions dans cette période:"

    expected_transaction_labels:
      - "Date de transaction"
      - "Heure de transaction"
      - "Date de comptabilisation"
      - "Date de valeur"
      - "Monnaie"
      - "Débit"
      - "Crédit"
      - "Sous-montant"
      - "Solde"
      - "N° de transaction"
      - "Description1"
      - "Description2"
      - "Description3"
      - "Notes de bas de page"
      - "Unnamed: 14"

    # Date format in the CSV
    date_format: "%Y-%m-%d" # ISO format YYYY-MM-DD

  # UBS Cards CSV Transaction Processor settings
  ubs_cards:
    # CSV parsing settings
    csv_settings:
      encoding: "iso-8859-1"
      separator: ";"
      header_row: 2

    # Expected column headers
    expected_columns:
      - "Numéro de compte"
      - "Numéro de carte"
      - "Titulaire de compte/carte"
      - "Date d'achat"
      - "Texte comptable"
      - "Secteur"
      - "Montant"
      - "Monnaie originale"
      - "Cours"
      - "Monnaie"
      - "Débit"
      - "Crédit"
      - "Ecriture"

    # Date format in the CSV
    date_format: "%d.%m.%Y"

    # Columns used to generate a stable transaction reference (hash).
    # Use original-currency fields rather than converted amounts, which
    # can shift between exports due to exchange rate changes.
    reference_columns:
      - "Date d'achat"
      - "Texte comptable"
      - "Montant"
      - "Monnaie originale"

  # CAMT.053 Processor settings
  camt053: {}

# Direct import to a self-hosted Actual Budget server (used with `--format actual`).
# Account names in your Actual budget MUST match the values in `account_names`
# above (or, equivalently, the `output_prefix` each processor produces).
#
# Sensitive values can be sourced from environment variables instead of this
# file (preferred for shared / committed configs):
#   ACTUAL_BUDGET_URL       overrides server_url
#   ACTUAL_BUDGET_PASSWORD  overrides password
#   ACTUAL_BUDGET_FILE      overrides budget_name
actual_budget:
  server_url: "http://actual-server:5006"
  password: "" # set via ACTUAL_BUDGET_PASSWORD
  budget_name: "" # the budget's name in the UI (e.g. "Personal")
  # Local SQLite cache. Optional — a fresh temp dir is used per run if unset.
  # data_dir: "/var/lib/actual-budget-transformer/data"
  # Category assigned to source rows that look like duplicates of existing
  # transactions (ADR-006). Must already exist in the budget.
  review_category: "To Review"
  # Per-batch ceiling on suspicious tx (ADR-002). Above this, the whole
  # account is stopped so the user can resolve the small recent slice.
  suspicious_threshold: 5

# Global settings
output:
  date_format: "%Y%m" # Format for date in output filenames
