# Actual Budget Transformer Configuration Template
# Copy this file to config.yaml (git-ignored) and fill in your actual values

# Map account identifiers (IBANs, card numbers) to the account's name in your
# Actual budget. An unmapped identifier is looked up as the name itself.
account_names:
  "CH0000000000": "personal_checking"
  "CH1111111111": "savings"
  "1234567890123456": "personal_card"
  "6543210987654321": "partner_card"

# Per-format settings.
#
# Keys marked "fallback only" are read only by the retired file-output image
# (see README), which fails without them. The import CLI ignores them.
#
# These are settings rather than constants on purpose: UBS changes its exports
# without announcing it, and the column labels are in the language of your
# e-banking, so they change when that setting changes. If an import stops
# recognising your file, correct the labels here - you do not need a new release.
processors:
  # UBS CSV Transaction Processor settings
  ubs_csv:
    # CSV parsing settings
    csv_settings:
      encoding: "utf-8-sig"
      separator: ";"
      header_rows: 8
      expected_columns: 15 # fallback only

    # Expected structure
    expected_header_labels:
      - "Numéro de compte:"
      - "IBAN:"
      - "Du:"
      - "Au:"
      - "Solde initial:"
      - "Solde final:"
      - "Évaluation en:"
      - "Nombre de transactions dans cette période:"

    expected_transaction_labels:
      - "Date de transaction"
      - "Heure de transaction"
      - "Date de comptabilisation"
      - "Date de valeur"
      - "Monnaie"
      - "Débit"
      - "Crédit"
      - "Sous-montant"
      - "Solde"
      - "N° de transaction"
      - "Description1"
      - "Description2"
      - "Description3"
      - "Notes de bas de page"
      - "Unnamed: 14" # fallback only: pandas' name for the empty last column

    # Date format in the CSV
    date_format: "%Y-%m-%d" # ISO format YYYY-MM-DD

  # UBS Cards CSV Transaction Processor settings
  ubs_cards:
    # CSV parsing settings
    csv_settings:
      encoding: "iso-8859-1"
      separator: ";"
      header_row: 2

    # Expected column headers
    expected_columns:
      - "Numéro de compte"
      - "Numéro de carte"
      - "Titulaire de compte/carte"
      - "Date d'achat"
      - "Texte comptable"
      - "Secteur"
      - "Montant"
      - "Monnaie originale"
      - "Cours"
      - "Monnaie"
      - "Débit"
      - "Crédit"
      - "Ecriture"

    # Date format in the CSV
    date_format: "%d.%m.%Y"

    # Columns used to generate a stable transaction reference (hash).
    # Use original-currency fields rather than converted amounts, which
    # can shift between exports due to exchange rate changes.
    #
    # WARNING: changing these changes every minted reference, so card
    # transactions already imported stop matching and come back as new.
    # Change them on a fresh account, or expect to resolve duplicates by hand.
    reference_columns:
      - "Date d'achat"
      - "Texte comptable"
      - "Montant"
      - "Monnaie originale"

# The self-hosted Actual Budget server to import into.
#
# Sensitive values can be sourced from environment variables instead of this
# file (preferred for shared / committed configs):
#   ACTUAL_BUDGET_URL       overrides server_url
#   ACTUAL_BUDGET_PASSWORD  overrides password
#   ACTUAL_BUDGET_SYNC_ID   overrides sync_id
actual_budget:
  server_url: "http://actual-server:5006"
  password: "" # set via ACTUAL_BUDGET_PASSWORD
  # The budget's Sync ID: Settings → Show advanced settings in Actual. Not its
  # name, because two budgets can share a name.
  sync_id: ""
  # Local SQLite cache. Optional — a fresh temp dir is used per run if unset.
  # data_dir: "/var/lib/actual-budget-transformer/data"

# Fallback only: the date format in the file-output image's filenames.
output:
  date_format: "%Y%m"
