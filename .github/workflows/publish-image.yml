name: Publish image

# Publishes ghcr.io/afrossard/actual-budget-transformer for one release.
# release.yml calls this in the run that cuts the release (CONTRIBUTING.md,
# "Releases"); dispatching it by hand republishes the newest release, which is
# the only one the moving tags may point at.
on:
  workflow_call:
    inputs:
      version:
        description: The release to publish, e.g. 0.4.2
        required: true
        type: string
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Pick the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.version }}

      # The image works with this Actual server version and any newer one,
      # never an older one (ADR-007). `:actual-<version>` and the label say so.
      - name: Read the Actual api version
        id: actual
        run: echo "version=$(node -p "require('./package.json').dependencies['@actual-app/api']")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `{{major}}` yields `0` on a 0.y.z release too: metadata-action only
      # skips it when told to.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.version }}
            type=raw,value=latest
            type=raw,value=actual-${{ steps.actual.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            actual-api-version=${{ steps.actual.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
