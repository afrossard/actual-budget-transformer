name: Release

# A merge to main lets release-please maintain the release PR; merging that PR
# cuts the release, and the same run publishes its image. A tag-triggered
# publish cannot work: GitHub starts no workflow for a tag GITHUB_TOKEN pushed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # continue-on-error and the guard below work around
      # https://github.com/googleapis/release-please-action/issues/1203: a
      # transient failure while drafting the next release PR must not strand a
      # release the same run already cut, whose outputs are already set.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Fail if release-please failed without cutting a release
        if: steps.release.outcome == 'failure' && steps.release.outputs.release_created != 'true'
        run: exit 1

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
