name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check linting
        run: uv run ruff check src/ tests/

      - name: Check formatting
        run: uv run ruff format --check src/ tests/

      - name: Run tests
        run: uv run pytest

  typescript:
    runs-on: ubuntu-latest

    # The integration and characterization tests run against a real Actual
    # server on purpose: they exist because Actual's behaviour is surprising, so
    # a mock would encode our assumptions rather than check them. `/data` is
    # ephemeral here, which is exactly the disposable budget they want.
    services:
      actual-server:
        image: actualbudget/actual-server:26.5.2
        ports:
          - 5006:5006

    env:
      ACTUAL_SERVER_URL: http://localhost:5006

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Wait for the Actual server
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5006/info >/dev/null; then
              curl -s http://localhost:5006/info
              exit 0
            fi
            sleep 2
          done
          echo "Actual server did not become healthy" >&2
          exit 1

      - name: Bootstrap the test budget
        run: npm run bootstrap

      - name: Run tests
        run: npm test
