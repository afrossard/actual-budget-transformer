[project]
name = "actual_budget_transformer"
version = "0.1.1"
requires-python = "==3.14.*"
dependencies = [
    "pandas (>=3.0.3,<3.1.0)",
    "pyiso20022>=1.6.2",
    "pyyaml (>=6.0.2,<7.0.0)",
    "xsdata[lxml]>=26.2",
]

[project.scripts]
actual-budget-transformer = "actual_budget_transformer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.1,<10",
    "ruff>=0.11",
    "ipykernel>=7.1,<8",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

